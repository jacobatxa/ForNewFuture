<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>创想营 · 学生档案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0A0A0A;--surface:#111;--ink:#FAFAFA;--muted:#8A8A8A;--faint:#525252;--line:rgba(255,255,255,.08)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Geist","PingFang SC","Noto Sans SC",sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;padding:40px 24px 80px}
  a{color:var(--muted);text-decoration:none} a:hover{color:var(--ink)}
  .wrap{max-width:760px;margin:0 auto}
  .back{font-size:13px;margin-bottom:28px;display:inline-block}
  .mono{font-family:"Geist Mono",Menlo,monospace;font-size:12px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
  h1{font-size:32px;font-weight:600;letter-spacing:-.03em;margin-bottom:8px}
  .lead{color:var(--muted);font-size:15px;margin-bottom:36px;max-width:36em}
  .warn{font-size:13px;color:var(--faint);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:28px}
  h2{font-size:14px;font-weight:600;margin:28px 0 12px;color:var(--muted)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:10px}
  .card h3{font-size:16px;font-weight:600;margin-bottom:4px}
  .card p{font-size:13px;color:var(--muted)}
  .empty{color:var(--faint);font-size:14px;padding:8px 0}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--faint);font-weight:500;font-size:12px}
  td{color:var(--muted)}
  td.name{color:var(--ink);font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../../">← AI 课程库</a>
  <p class="mono">Camp · students</p>
  <h1>创想营 · 学生档案</h1>
  <p class="lead">学习评价、当堂产出、作业提交。点开就能看。国庆营与后续场地共用这一套课。</p>
  <p class="warn">这个仓库是公开的。这里只放花名、评价摘要和作业链接，不要写手机号、身份证、家庭住址。</p>

  <h2>本届名册</h2>
  <div class="card">
    <table>
      <thead>
        <tr><th>姓名</th><th>场次</th><th>进度</th><th>最近评价</th></tr>
      </thead>
      <tbody>
        <tr><td colspan="4" class="empty">还没有录入。把名单补进这一页，或在同目录加个人页再链过来。</td></tr>
      </tbody>
    </table>
  </div>

  <h2>作业与产出</h2>
  <div class="card">
    <h3>辨智能 · 投票与打分</h3>
    <p class="empty">照片 / 记录表待上传</p>
  </div>
  <div class="card">
    <h3>探黑盒 · 下一词与发送路径</h3>
    <p class="empty">笔记或截图待上传</p>
  </div>
  <div class="card">
    <h3>会提问 · Prompt 五习惯</h3>
    <p class="empty">学生 Prompt 原稿待上传</p>
  </div>
  <div class="card">
    <h3>造 Agent · 成品</h3>
    <p class="empty">网页 / 助手链接待上传</p>
  </div>
</div>
</body>
</html>
