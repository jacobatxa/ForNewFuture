<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>森林迷宫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#10241c;--moss:#1c4634;--leaf:#2f6b45;--lantern:#f2c14e;
    --cream:#f6efe2;--ink:#1a241c;--bark:#6b4a2e;--miss:#e07a5f;
    --display:"ZCOOL KuaiLe","PingFang SC",sans-serif;
    --sans:"Noto Sans SC","PingFang SC",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:var(--sans);color:var(--cream);background:
    radial-gradient(900px 420px at 10% 100%, #245c3e 0, transparent 55%),
    radial-gradient(700px 380px at 100% 0, #163828 0, transparent 50%),
    var(--night)}
  button,a{font:inherit;color:inherit}
  .app{height:100svh;display:grid;grid-template-rows:auto 1fr;padding:14px 16px 16px;gap:12px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px}
  header a{text-decoration:none;font-size:13px;opacity:.75}
  h1{font-family:var(--display);font-size:clamp(28px,4vw,40px);letter-spacing:.04em;font-weight:400}
  .where{font-size:14px;color:var(--lantern)}
  .world{min-height:0;display:grid;grid-template-columns:220px 1fr;gap:14px}
  .woods{position:relative;border-radius:22px;background:linear-gradient(#163528,#0c1c14);overflow:hidden;border:1px solid rgba(242,193,78,.25)}
  .woods svg{width:100%;height:100%;display:block}
  .clearing{min-height:0;display:flex;flex-direction:column;gap:10px;background:rgba(246,239,226,.06);border:1px solid rgba(246,239,226,.14);border-radius:22px;padding:14px 16px}
  .who{display:flex;gap:14px;align-items:center;min-height:0}
  .face{width:92px;height:92px;flex:none;background:var(--cream);border-radius:50%;display:grid;place-items:center}
  .face svg{width:74px;height:74px}
  .say{flex:1;background:var(--cream);color:var(--ink);border-radius:18px 18px 18px 6px;padding:12px 14px}
  .say b{display:block;font-family:var(--display);font-size:13px;color:var(--bark);font-weight:400;margin-bottom:4px}
  .say p{font-size:clamp(16px,2vw,20px);line-height:1.45;font-weight:700}
  .say small{display:block;margin-top:6px;font-size:12px;font-weight:500;color:#6d6256}
  .ask{font-size:14px;color:var(--lantern)}
  .forks{display:grid;grid-template-columns:1fr;gap:8px;min-height:0}
  .fork{text-align:left;background:transparent;border:1.5px solid rgba(246,239,226,.35);border-radius:14px;padding:10px 12px;cursor:pointer;display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center}
  .fork i{font-style:normal;font-family:var(--display);font-size:15px;color:var(--lantern)}
  .fork span{font-size:15px;line-height:1.4}
  .fork:hover{background:rgba(242,193,78,.12);border-color:var(--lantern)}
  .fork.bad{animation:shake .4s;border-color:var(--miss);background:rgba(224,122,95,.15)}
  .fork.good{border-color:#8fd0a4;background:rgba(143,208,164,.16)}
  .fork:disabled{cursor:default}
  @keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
  .missline{min-height:1.3em;font-size:14px;color:var(--miss);font-weight:700}
  .reveal{display:none;background:var(--cream);color:var(--ink);border-radius:16px;padding:12px 14px;gap:8px}
  .reveal.on{display:grid;grid-template-columns:1fr 1fr 1fr auto;align-items:end}
  .reveal div b{display:block;font-size:12px;color:var(--bark);margin-bottom:3px}
  .reveal div span{font-size:14px;line-height:1.4;font-weight:700}
  .go{border:none;background:#1c4634;color:#f6efe2;border-radius:999px;padding:12px 16px;cursor:pointer;font-weight:700;white-space:nowrap}
  .go:hover{background:#2f6b45}
  .gate{position:absolute;inset:0;display:grid;place-items:center;background:rgba(16,36,28,.55);border-radius:22px}
  .card{width:min(520px,92%);background:var(--cream);color:var(--ink);border-radius:24px;padding:28px 26px}
  .card h2{font-family:var(--display);font-size:40px;font-weight:400}
  .card p{margin:10px 0 18px;font-size:16px;line-height:1.55}
  .card button,.card a.back{display:inline-block;background:#1c4634;color:#f6efe2;text-decoration:none;border:none;border-radius:999px;padding:12px 18px;cursor:pointer;font-weight:700}
  .lamps{display:flex;gap:6px;align-items:center}
  .lamps i{width:10px;height:10px;border-radius:50%;background:#1a3328;border:1px solid #6b4a2e;display:block}
  .lamps i.on{background:var(--lantern);box-shadow:0 0 8px var(--lantern)}
  .mute{border:1px solid rgba(246,239,226,.35);background:transparent;border-radius:999px;padding:6px 10px;cursor:pointer;font-size:13px}
  .fork:focus-visible,.go:focus-visible,#gateBtn:focus-visible,.mute:focus-visible{outline:2px solid var(--lantern);outline-offset:3px}
  .face{transition:transform .18s cubic-bezier(.22,1,.36,1)}
  .face.pop{transform:scale(1.12)}
  #walker{transition:transform .55s cubic-bezier(.22,1,.36,1)}
  .clearing.hit{animation:shake .28s}
  .say p{min-height:2.8em}
  @media (prefers-reduced-motion:reduce){
    .face,.fork,#walker{transition:none!important}
    .clearing.hit,.fork.bad{animation:none!important}
  }
  @media (max-width:800px){
    html,body{overflow:auto}
    .app{height:auto;min-height:100svh}
    .world{grid-template-columns:1fr;grid-template-rows:140px 1fr}
    .reveal.on{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app">
  <header>
      <a href="20-m2-pilot-deck.html#4" target="_top">← 回到课</a>

          <button type="button" id="gateBtn">走进森林</button>

      </div>
    </div>
  </div>
</div>
<script>
var LEVELS = [
  {place:"兔子谷", name:"兔子", scene:"兔子谷里，兔子们成群结队往山上跑",

   choices:["跑的兔子再多，也变不成「天要塌」的证据","兔子胆子小，所以它说的话全是错的","山那么高，跑上去也躲不住"],

  {place:"狮子崖", name:"狮王", scene:"狮子崖上，狮王举着一株草药",

   choices:["百兽之王的名头，证明不了草药灵不灵","它是国王，国王说的话大家都得听","能治病的草药，味道一定很苦"],
   said:"这株草药能治病。", why:"我是百兽之王。", flaw:"名头是名头，药效是药效，两码事。",
   punch:"名头响，不能当凭据。",
   sent:"他说草药灵，理由是自己是百兽之王。但名头响，不能当凭据。",
   side:["「听」和「真」是两回事——大家听国王的，不代表国王说得对。","跑题了。苦不苦，跟药效没关系。"]},
  {place:"狐狸坡", name:"狐狸", scene:"狐狸坡上，狐狸扯着嗓子喊",
   line:"大灰狼就在山后面！再不躲起来，咱们全完了！",
   face:'<svg viewBox="0 0 64 64"><path d="M18 18 L26 32 L14 28 Z" fill="#e07a4a"/><path d="M46 18 L38 32 L50 28 Z" fill="#e07a4a"/><path d="M20 26 C18 46 26 52 32 52 C38 52 46 46 44 26 Z" fill="#f0a06a"/><circle cx="28" cy="34" r="1.7" fill="#1a241c"/><circle cx="36" cy="34" r="1.7" fill="#1a241c"/><path d="M32 40 v4" stroke="#1a241c" stroke-width="1.4"/></svg>',
   choices:["越吓人，越要问一句：狼在哪？证据呢？","狐狸最狡猾，它的话一句都不能信","跑得越快，就越安全"],
   said:"大灰狼来了，不躲就全完了。", why:"什么都没凭，就靠吓人。", flaw:"害怕会让人来不及多想，但害怕不是证据。",

   choices:["它爷爷一个人的事，证明不了谁吃都灵","乌龟本来就长寿，所以它在撒谎","浆果是红色的，红色食物都养生"],
   said:"谁天天吃，都能长命百岁。", why:"我爷爷吃了，活了一百岁。", flaw:"一个人的故事，只能说发生过，说不了是规律。",
   punch:"一个例子，不能当凭据。",
   sent:"他说谁吃都长寿，理由是他爷爷活了一百岁。但一个例子，不能当凭据。",
   side:["攻击说话的人——乌龟长寿是真的，可它这句话照样站不住。","颜色不是规律——这跟「凭个例」是同一个毛病。"]},
  {place:"公鸡岭", name:"公鸡", scene:"公鸡岭上，公鸡挺着胸脯",
   line:"看见没？我每天一打鸣，太阳就出来。没我叫，天根本亮不了！",
   face:'<svg viewBox="0 0 64 64"><path d="M24 16 l4 -8 4 7 4 -7 4 8 Z" fill="#e07a5f"/><circle cx="34" cy="32" r="14" fill="#f2d2a2"/><path d="M46 30 l8 -2 -7 6 Z" fill="#e2b15a"/><circle cx="38" cy="30" r="1.6" fill="#1a241c"/></svg>',
   choices:["打鸣在前、日出在后，不等于太阳是它叫出来的","公鸡起得早，它说的话肯定有道理","它叫得太小声，太阳听不见"],
   said:"太阳是我叫出来的。", why:"每次我先打鸣，太阳后出来。", flaw:"挨着发生的两件事，不一定有因果关系。",
   punch:"先后，不等于因果。",
   sent:"他说太阳是它叫出来的，理由是打鸣在前。但先后，不等于因果。",
   side:["攻击说话的人——起得早是好事，跟这句话对不对没关系。","顺着它的话往下编，越编越远了。"]},
  {place:"老虎洞", name:"狐狸", scene:"老虎洞前，狐假虎威",
   line:"瞧见没？它们都怕我，才跑的。",
   face:'<svg viewBox="0 0 64 64"><path d="M16 22 l-4 -8 10 5 Z" fill="#e2b15a"/><path d="M48 22 l4 -8 -10 5 Z" fill="#e2b15a"/><circle cx="32" cy="36" r="14" fill="#f0a06a"/><path d="M24 32 h6 M34 32 h6" stroke="#c4503a" stroke-width="2"/><circle cx="28" cy="36" r="1.4" fill="#1a241c"/><circle cx="40" cy="36" r="1.4" fill="#1a241c"/></svg>',
   said:"动物们是怕我才跑的。", why:"我一走过去，它们就四散奔逃。", flaw:"它们怕的明明是身后的老虎。话被偷换了。",
   punch:"他说的，不是那回事。",
   sent:"他说动物们怕它，理由是动物们奔逃。但它们怕的是老虎，不是狐狸。",
   side:["还是没看「怕」的对象——怕的是老虎，跟跑得快没关系。","怪观众胆小，不检查话本身——这毛病和它犯的一样。"],
   choices:["动物们怕的是老虎，狐狸把意思换成了「怕它」","狐狸跑得比老虎快，所以动物们怕它","小动物们的胆子太小了"]}
];
var SIDES = ["左边的路","中间的路","右边的路"];
var phase = "intro";
var lineTimer = null;
var lit = document.getElementById("lit");
var walker = document.getElementById("walker");
var gates = document.getElementById("gates");
var ys = [560,470,380,290,200,110,40];
var ac = null;
var muted = sessionStorage.getItem("maze-mute") === "1";
var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function drawGates(){
  gates.innerHTML = ys.slice(0,6).map(function(y,i){
    return '<circle data-i="'+i+'" cx="110" cy="'+y+'" r="8" fill="#1a3328" stroke="#6b4a2e" stroke-width="3"/>';
  }).join("");
}
function paintPath(n){
  var y = ys[Math.min(n,6)];
  lit.setAttribute("d", "M110 600 V"+y);
  walker.setAttribute("transform", "translate(0,"+(y-590)+")");
  Array.prototype.forEach.call(gates.querySelectorAll("circle"), function(c,i){
    c.setAttribute("fill", i < n ? "#f2c14e" : "#1a3328");
  });
  var lamps = document.getElementById("lamps");
  lamps.innerHTML = "";
  for (var i = 0; i < 6; i++){
    var dot = document.createElement("i");
    if (i < n) dot.className = "on";
    lamps.appendChild(dot);
  }
}
function orderFor(i){
  var r = (i + 1) % 3;
  return [0,1,2].slice(r).concat([0,1,2].slice(0, r));
}
function bus(){
  if (muted) return null;
  if (!ac){
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();
  }
  if (ac.state === "suspended") ac.resume();
  return ac;
}
function tone(freq, dur, type){
  var ctx = bus();
  if (!ctx) return;
  var o = ctx.createOscillator();
  var g = ctx.createGain();
  o.type = type || "sine";
  o.frequency.value = freq;
  var t = ctx.currentTime;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.06, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t + dur);
}
function sfxOk(){ tone(523, 0.09, "sine"); setTimeout(function(){ tone(784, 0.14, "sine"); }, 90); }
function sfxBad(){ tone(196, 0.12, "triangle"); }
function setMute(on){
  muted = on;
  sessionStorage.setItem("maze-mute", on ? "1" : "0");
  document.getElementById("mute").textContent = on ? "声音关" : "声音开";
  document.getElementById("mute").setAttribute("aria-pressed", on ? "true" : "false");
}
function skipLine(){
  if (phase !== "line" || !lineTimer) return;
  clearInterval(lineTimer.timer);
  lineTimer.el.textContent = lineTimer.full;
  var done = lineTimer.done;
  lineTimer = null;
  phase = "choose";
  done();
}
function speak(text, done){
  var el = document.getElementById("line");
  var full = "「" + text + "」";
  if (reduceMotion){
    el.textContent = full;
    phase = "choose";
    done();
    return;
  }
  phase = "line";
  var n = 0;
  el.textContent = "";
  var timer = setInterval(function(){
    n += 1;
    el.textContent = full.slice(0, n);
    if (n >= full.length){
      clearInterval(timer);
      lineTimer = null;
      phase = "choose";
      done();
    }
  }, 18);
  lineTimer = { timer: timer, el: el, full: full, done: done };
}
function showGate(title, text, label, fn){
  document.getElementById("gateTitle").textContent = title;
  document.getElementById("gateText").textContent = text;
  var btn = document.getElementById("gateBtn");
  btn.textContent = label;
  btn.onclick = fn;
  document.getElementById("gate").style.display = "grid";
}
function hideGate(){ document.getElementById("gate").style.display = "none"; }

function renderLevel(i){
  var L = LEVELS[i];
  phase = "line";
  document.getElementById("where").textContent = (i+1)+" / 6 · "+L.place;
  document.getElementById("name").textContent = L.name;
  document.getElementById("scene").textContent = L.scene;
  document.getElementById("face").innerHTML = L.face;
  document.getElementById("face").classList.remove("pop");
  document.getElementById("ask").textContent = "听完它说的话，再选一条路。空格可以快进。";
  document.getElementById("miss").textContent = "";
  document.getElementById("reveal").className = "reveal";
  document.getElementById("reveal").innerHTML = "";
  document.getElementById("forks").innerHTML = "";
  paintPath(i);
  speak(L.line, function(){ showChoices(i); });
}
function showChoices(i){
  var L = LEVELS[i];
  var order = orderFor(i);
  var box = document.getElementById("forks");
  box.innerHTML = "";
  document.getElementById("ask").textContent = "三条路，只有一条走得通。";
  order.forEach(function(src, k){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "fork";
    b.dataset.src = String(src);
    b.innerHTML = "<i>"+SIDES[k]+"</i><span>"+L.choices[src]+"</span>";
    b.onclick = function(){ pick(i, src, b); };
    box.appendChild(b);
  });
  phase = "choose";
  var first = box.querySelector(".fork");
  if (first) first.focus();
}
function pick(i, src, btn){
  if (phase !== "choose") return;
  var L = LEVELS[i];
  if (src !== 0){
    phase = "locked";
    btn.classList.add("bad");
    if (!reduceMotion) document.querySelector(".clearing").classList.add("hit");
    var note = (L.side && L.side[src - 1]) ? L.side[src - 1] : "这条路走不通。再听一遍它说的话。";
    document.getElementById("miss").textContent = note;
    sfxBad();
    setTimeout(function(){
      btn.classList.remove("bad");
      document.querySelector(".clearing").classList.remove("hit");
      phase = "choose";
    }, 420);
    return;
  }
  phase = "locked";
  Array.prototype.forEach.call(document.querySelectorAll(".fork"), function(b){ b.disabled = true; });
  btn.classList.add("good");
  document.getElementById("face").classList.add("pop");
  document.getElementById("miss").textContent = "";
  document.getElementById("ask").textContent = "雾散了。一起读：" + L.sent;
  sfxOk();
  paintPath(i+1);
  sessionStorage.setItem("maze-at", String(i+1));
  var box = document.getElementById("reveal");
  box.className = "reveal on";
  var next = i === LEVELS.length-1 ? "走出森林" : "继续往前";
  box.innerHTML =
    "<div><b>它说了什么</b><span>"+L.said+"</span></div>"+
    "<div><b>它凭什么</b><span>"+L.why+"</span></div>"+
    "<div><b>毛病在哪</b><span>"+L.flaw+"</span></div>"+
    "<button type='button' class='go' id='nextGo'>"+next+"</button>";
  phase = "reveal";
  var go = document.getElementById("nextGo");
  go.onclick = function(){ advance(i); };
  go.focus();
}
function advance(i){
  if (phase !== "reveal" && phase !== "outro") return;
  if (i >= LEVELS.length-1){
    phase = "outro";
    paintPath(6);
    document.getElementById("where").textContent = "林外";
    showGate("走出森林了", "六句话都听清了。大家都跑、名头响、吓人、一个例子、先后，都不能当凭据。最后一句，狐狸把怕老虎换成了怕它。记住那个公式：他说什么，理由是什么。但什么，不能当凭据。", "回课上看速查卡", function(){
      sessionStorage.removeItem("maze-at");
      var dest = "20-m2-pilot-deck.html#6";
      if (window.top && window.top !== window) window.top.location.href = dest;
      else location.href = dest;
    });
    return;
  }
  renderLevel(i+1);
}
document.addEventListener("keydown", function(e){
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "m" || e.key === "M"){ setMute(!muted); return; }
  if (phase === "line" && (e.key === " " || e.key === "Enter")){ e.preventDefault(); skipLine(); return; }
  if (phase === "reveal" && (e.key === "Enter" || e.key === " ")){
    var go = document.getElementById("nextGo");
    if (go && document.activeElement === go) return;
    if (go){ e.preventDefault(); go.click(); }
    return;
  }
  if (phase !== "choose") return;
  var forks = document.querySelectorAll(".fork:not(:disabled)");
  if (!forks.length) return;
  var idx = Array.prototype.indexOf.call(forks, document.activeElement);
  if (e.key === "ArrowDown"){ e.preventDefault(); forks[idx < 0 ? 0 : Math.min(forks.length - 1, idx + 1)].focus(); }
  if (e.key === "ArrowUp"){ e.preventDefault(); forks[idx < 0 ? 0 : Math.max(0, idx - 1)].focus(); }
  if (e.key === "1" || e.key === "2" || e.key === "3"){
    e.preventDefault();
    var n = +e.key - 1;
    if (forks[n]) forks[n].click();
  }
});
document.getElementById("line").addEventListener("click", function(){ if (phase === "line") skipLine(); });
document.getElementById("mute").addEventListener("click", function(){ setMute(!muted); });
drawGates();
paintPath(0);
setMute(muted);
document.getElementById("gateBtn").focus();
var saved = +sessionStorage.getItem("maze-at") || 0;
document.getElementById("gateBtn").onclick = function(){
  hideGate();
  renderLevel(saved > 0 && saved < 6 ? saved : 0);
};
if (saved > 0 && saved < 6){
  document.getElementById("gateText").textContent = "上次走到第 " + (saved+1) + " 个路口。可以从那里继续，雾还没散完。";
  document.getElementById("gateBtn").textContent = "从这里继续";
}
</script>
