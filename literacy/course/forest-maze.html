<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>森林迷宫</title>
<!-- forest path v4 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --moss:#163528;--leaf:#245a3c;--canopy:#0d2419;--lantern:#ffc857;
    --paper:#fff6e8;--ink:#1c2a22;--bark:#7a5130;--miss:#d8573a;--ok:#2f8f5b;
    --display:"ZCOOL KuaiLe","PingFang SC",sans-serif;
    --sans:"Noto Sans SC","PingFang SC",sans-serif;
    --v:4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:var(--sans);color:var(--paper);
    background:
      radial-gradient(ellipse 80% 50% at 20% 110%, rgba(255,200,87,.18), transparent 55%),
      radial-gradient(ellipse 60% 40% at 90% -10%, rgba(90,140,80,.35), transparent 50%),
      linear-gradient(165deg, #081710 0%, #102418 45%, #163528 100%);
  }
  button,a{font:inherit;color:inherit}
  .app{height:100svh;display:grid;grid-template-rows:auto 1fr;padding:12px 14px 14px;gap:10px}
  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header .brand{flex:1;min-width:140px;display:flex;align-items:baseline;gap:10px}
  header a{text-decoration:none;font-size:15px;opacity:.7}
  header a:hover{opacity:1;color:var(--lantern)}
  h1{font-family:var(--display);font-size:clamp(26px,3.6vw,36px);letter-spacing:.04em;font-weight:400}
  .tag{font-size:13px;letter-spacing:.08em;background:var(--lantern);color:#1c2a22;border-radius:999px;padding:3px 8px;font-weight:900}
  .where{font-size:16px;color:var(--lantern);font-weight:700}
  .lamps{display:flex;gap:6px;align-items:center;margin-left:auto}
  .lamps i{width:11px;height:11px;border-radius:50%;background:#0a1a12;border:1px solid #4a6b52;display:block}
  .lamps i.on{background:var(--lantern);box-shadow:0 0 10px var(--lantern);border-color:var(--lantern)}
  .mute{border:1px solid rgba(255,246,232,.28);background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:15px}
  .mute:hover{border-color:var(--lantern);color:var(--lantern)}

  .world{min-height:0;display:grid;grid-template-columns:minmax(240px,34%) 1fr;gap:14px}
  .woods{
    position:relative;border-radius:28px;overflow:hidden;
    isolation:isolate;
    background:
      linear-gradient(180deg, #0a1a12 0%, #12261c 28%, #1b3828 62%, #243f2c 100%);
    border:2px solid rgba(255,200,87,.22);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.04), 0 18px 40px rgba(0,0,0,.28);
  }
  .woods .sky{
    position:absolute;inset:0 0 42% 0;
    background:
      radial-gradient(ellipse 70% 55% at 50% 100%, rgba(120,160,90,.22), transparent 70%),
      linear-gradient(180deg, #06140e 0%, #0d2218 55%, transparent 100%);
  }
  .woods .ground{
    position:absolute;left:0;right:0;bottom:0;height:58%;
    background:
      radial-gradient(ellipse 90% 40% at 50% 0%, rgba(70,110,60,.35), transparent 60%),
      linear-gradient(180deg, #1a3324 0%, #2a4a30 45%, #3a5a38 100%);
  }
  .woods .ground::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(ellipse 18% 10% at 22% 70%, rgba(40,70,40,.5), transparent),
      radial-gradient(ellipse 22% 12% at 78% 62%, rgba(35,60,35,.45), transparent),
      radial-gradient(ellipse 30% 14% at 50% 88%, rgba(25,45,28,.55), transparent);
    opacity:.9;
  }
  .path{
    position:absolute;left:50%;bottom:0;width:118%;height:78%;
    transform:translateX(-50%);
    background:
      linear-gradient(90deg, transparent 0%, rgba(90,62,28,.15) 18%, transparent 32%),
      linear-gradient(90deg, transparent 68%, rgba(90,62,28,.15) 82%, transparent 100%),
      linear-gradient(180deg,
        rgba(120,90,48,.15) 0%,
        rgba(130,95,52,.55) 18%,
        rgba(110,78,42,.7) 48%,
        rgba(96,68,36,.85) 100%);
    clip-path:polygon(46% 0%, 54% 0%, 92% 100%, 8% 100%);
    filter:contrast(1.05);
  }
  .path::before{
    content:"";position:absolute;inset:0;
    background:
      repeating-linear-gradient(175deg, transparent 0 26px, rgba(60,40,18,.18) 26px 28px),
      repeating-linear-gradient(8deg, transparent 0 34px, rgba(255,220,140,.05) 34px 35px);
    clip-path:inherit;
    opacity:.9;
  }
  .path::after{
    content:"";position:absolute;left:50%;top:4%;width:10%;height:92%;
    transform:translateX(-50%);
    background:linear-gradient(180deg, rgba(255,200,87,.08), rgba(255,200,87,.02) 40%, transparent);
    filter:blur(8px);
  }
  .stones{position:absolute;inset:0;pointer-events:none;z-index:3}
  .stones i{
    position:absolute;left:50%;width:10px;height:10px;border-radius:50%;
    background:#5a6e52;border:1.5px solid #9bb08a;
    transform:translateX(-50%);
    box-shadow:0 0 0 3px rgba(20,40,25,.35);
    opacity:.55;transition:background .3s, box-shadow .3s, opacity .3s;
  }
  .stones i.on{
    background:var(--lantern);border-color:#ffe7a8;opacity:1;
    box-shadow:0 0 12px rgba(255,200,87,.75), 0 0 0 3px rgba(255,200,87,.18);
  }
  .layer{position:absolute;inset:0;pointer-events:none}
  .layer svg{position:absolute;inset:0;width:100%;height:100%}
  .fog{
    position:absolute;inset:-10% -20%;pointer-events:none;
    background:
      radial-gradient(ellipse 40% 28% at 30% 45%, rgba(210,230,200,.16), transparent 70%),
      radial-gradient(ellipse 45% 30% at 70% 55%, rgba(190,220,190,.12), transparent 70%),
      radial-gradient(ellipse 55% 25% at 50% 20%, rgba(180,210,180,.1), transparent 65%);
    animation:drift 14s ease-in-out infinite alternate;
    mix-blend-mode:screen;
  }
  .fog.mid{animation-duration:18s;animation-delay:-4s;opacity:.75;filter:blur(2px)}
  .fog.near{animation-duration:11s;top:40%;opacity:.55;filter:blur(1px)}
  @keyframes drift{
    from{transform:translateX(-3%) translateY(1%)}
    to{transform:translateX(4%) translateY(-2%)}
  }
  .motes{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:4}
  .motes i{
    position:absolute;width:3px;height:3px;border-radius:50%;
    background:rgba(255,230,150,.85);box-shadow:0 0 6px rgba(255,200,87,.8);
    animation:float linear infinite;
  }
  @keyframes float{
    0%{transform:translateY(10px);opacity:0}
    15%{opacity:1}
    85%{opacity:.7}
    100%{transform:translateY(-110%);opacity:0}
  }
  .vignette{
    position:absolute;inset:0;pointer-events:none;z-index:5;
    background:
      radial-gradient(ellipse 80% 70% at 50% 55%, transparent 40%, rgba(0,0,0,.45) 100%),
      linear-gradient(90deg, rgba(0,0,0,.35), transparent 18%, transparent 82%, rgba(0,0,0,.35));
  }
  .lantern-glow{
    position:absolute;left:50%;width:48%;aspect-ratio:1;border-radius:50%;
    transform:translateX(-50%);
    background:radial-gradient(circle, rgba(255,200,87,.45) 0%, rgba(255,160,40,.12) 42%, transparent 70%);
    filter:blur(2px);pointer-events:none;z-index:2;
    transition:bottom .65s cubic-bezier(.22,1,.36,1), width .65s;
    animation:pulseGlow 2.4s ease-in-out infinite;
  }
  @keyframes pulseGlow{50%{opacity:.72;transform:translateX(-50%) scale(1.06)}}
  .kid{
    position:absolute;left:50%;width:58%;max-width:180px;
    transform:translateX(-50%);
    transition:bottom .65s cubic-bezier(.22,1,.36,1), width .65s, filter .3s;
    filter:drop-shadow(0 10px 14px rgba(0,0,0,.45));
    animation:bob 2s ease-in-out infinite;
    z-index:3;
  }
  @keyframes bob{50%{transform:translateX(-50%) translateY(-6px)}}
  .kid.back{animation:none;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45)) brightness(.85);transform:translateX(-50%) translateY(7px) scale(.97)}

  .clearing{
    min-height:0;display:grid;grid-template-rows:auto auto 1fr auto;
    gap:12px;overflow-y:auto;overscroll-behavior:contain;background:rgba(255,246,232,.96);color:var(--ink);
    border-radius:28px;padding:16px 18px 14px;
    border:2px solid rgba(255,200,87,.35);
    box-shadow:0 18px 40px rgba(0,0,0,.28);
  }
  .who{display:flex;gap:16px;align-items:stretch;min-height:0}
  .face{
    width:clamp(140px,18vw,200px);aspect-ratio:1;flex:none;
    background:
      radial-gradient(circle at 50% 40%, #fff 0%, #f3e4c8 70%);
    border-radius:28px;border:3px solid #1c2a22;overflow:hidden;
    display:grid;place-items:center;
    transition:transform .18s cubic-bezier(.22,1,.36,1);
  }
  .face.pop{transform:scale(1.08) rotate(-2deg)}
  .face img{width:108%;height:108%;object-fit:contain;object-position:center 60%}
  .say{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0}
  .say b{display:block;font-family:var(--display);font-size:21px;color:var(--bark);font-weight:400;margin-bottom:6px}
  .say p{font-size:clamp(20px,2.5vw,27px);line-height:1.45;font-weight:900;min-height:3.1em}
  .say small{display:block;margin-top:8px;font-size:15px;font-weight:500;color:#6d6256}
  .ask{font-size:17px;color:#8a5a1e;font-weight:700}

  .forks{display:grid;grid-template-columns:1fr;gap:9px;min-height:0;align-content:start}
  .fork{
    text-align:left;background:#fff;color:var(--ink);
    border:2.5px solid #1c2a22;border-radius:16px;padding:13px 16px;cursor:pointer;
    display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:center;
    transition:transform .18s cubic-bezier(.22,1,.36,1), background .15s, border-color .15s;
  }
  .fork.in{animation:rise .38s cubic-bezier(.22,1,.36,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .fork i{
    font-style:normal;font-family:var(--display);font-size:17px;font-weight:400;
    color:#1c2a22;background:#ffe7a8;border-radius:999px;width:32px;height:32px;
    display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .fork span{font-size:18px;line-height:1.4;font-weight:700}
  .fork:hover{transform:translateY(-3px);background:#fffaf0;border-color:var(--bark)}
  .fork.bad{animation:shake .4s;border-color:var(--miss);background:#ffe8e2}
  .fork.good{border-color:var(--ok);background:#e6f6ec}
  .fork:disabled{cursor:default}
  @keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

  .missline{min-height:1.3em;font-size:16px;color:var(--miss);font-weight:900}
  .reveal{display:none;background:#1c2a22;color:var(--paper);border-radius:18px;padding:14px 16px;gap:10px}
  .reveal.on{display:grid;grid-template-columns:1fr 1fr 1fr auto;align-items:end}
  .reveal div b{display:block;font-size:14px;color:var(--lantern);margin-bottom:4px;font-weight:700}
  .reveal div span{font-size:16px;line-height:1.4;font-weight:700}
  .go{border:none;background:var(--lantern);color:#1c2a22;border-radius:999px;padding:12px 18px;cursor:pointer;font-weight:900;font-size:17px;white-space:nowrap}
  .go:hover{filter:brightness(1.06)}

  .gate{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,22,14,.72);border-radius:28px;z-index:5;backdrop-filter:blur(3px)}
  .card{width:min(520px,92%);background:var(--paper);color:var(--ink);border-radius:28px;padding:30px 28px;border:3px solid #1c2a22;box-shadow:0 24px 50px rgba(0,0,0,.35)}
  .card h2{font-family:var(--display);font-size:clamp(34px,5vw,44px);font-weight:400}
  .card p{margin:12px 0 20px;font-size:18px;line-height:1.55;font-weight:500}
  .card button{display:inline-block;background:#163528;color:var(--paper);border:none;border-radius:999px;padding:14px 22px;cursor:pointer;font-weight:900;font-size:18px}
  .card button:hover{background:#245a3c}

  .fork:focus-visible,.go:focus-visible,#gateBtn:focus-visible,.mute:focus-visible{outline:3px solid var(--lantern);outline-offset:3px}
  .clearing.hit{animation:shake .28s}

  @media (prefers-reduced-motion:reduce){
    .face,.fork,.kid,.fog,.motes i,.lantern-glow{transition:none!important;animation:none!important}
    .clearing.hit,.fork.bad{animation:none!important}
  }
  @media (max-width:860px){
    html,body{overflow:auto}
    .app{height:auto;min-height:100svh}
    .world{grid-template-columns:1fr;grid-template-rows:210px 1fr}
    .kid{max-width:110px}
    .who{flex-direction:column;align-items:center;text-align:center}
    .face{width:160px}
    .reveal.on{grid-template-columns:1fr}
  }
</style>
</head>

      <div class="path"></div>
      <div class="layer far">
        <svg viewBox="0 0 280 520" preserveAspectRatio="xMidYMax slice">
          <g fill="#163528" opacity=".85">
            <ellipse cx="38" cy="210" rx="42" ry="58"/><rect x="30" y="250" width="16" height="90" rx="3"/>

            <path d="M280 520 C240 475 250 430 280 395 Z"/>

  </div>
</div>
<script>
var LEVELS = [
  {place:"兔子谷", img:"assets/maze/rabbit.png?v=4", name:"兔子", scene:"兔子谷里，兔子们成群结队往山上跑",
   line:"不好啦！天要塌下来了！你没看见吗，大家都在往山上跑！",
   choices:["跑的兔子再多，也变不成「天要塌」的证据","兔子胆子小，所以它说的话全是错的","山那么高，跑上去也躲不住"],
   said:"天要塌了。", why:"大家都在往山上跑。", flaw:"多少只兔子在跑，跟天塌不塌，是两码事。",
   punch:"大家都跑，不能当凭据。",
   sent:"他说天要塌了，理由是大家都在跑。但大家都跑，不能当凭据。",
   side:["攻击说话的人可不算本事——兔子胆小，不等于它这句是假话。","离题了。山高不高，跟天塌不塌没关系。"]},
  {place:"狮子崖", img:"assets/maze/lion.png?v=4", name:"狮王", scene:"狮子崖上，狮王举着一株草药",
   line:"我是百兽之王。这株草药我说它能治病，它就一定能治病。",
   choices:["百兽之王的名头，证明不了草药灵不灵","它是国王，国王说的话大家都得听","能治病的草药，味道一定很苦"],
   said:"这株草药能治病。", why:"我是百兽之王。", flaw:"名头是名头，药效是药效，两码事。",
   punch:"名头响，不能当凭据。",
   sent:"他说草药灵，理由是自己是百兽之王。但名头响，不能当凭据。",
   side:["「听」和「真」是两回事——大家听国王的，不代表国王说得对。","跑题了。苦不苦，跟药效没关系。"]},
  {place:"狐狸坡", img:"assets/maze/fox.png?v=4", name:"狐狸", scene:"狐狸坡上，狐狸扯着嗓子喊",
   line:"大灰狼就在山后面！再不躲起来，咱们全完了！",
   choices:["越吓人，越要问一句：狼在哪？证据呢？","狐狸最狡猾，它的话一句都不能信","跑得越快，就越安全"],
   said:"大灰狼来了，不躲就全完了。", why:"什么都没凭，就靠吓人。", flaw:"害怕会让人来不及多想，但害怕不是证据。",
   punch:"吓人，不能当凭据。",
   sent:"他说狼来了，理由是把大家吓住。但吓人，不能当凭据。",
   side:["又是攻击说话的人——狐狸平时狡猾，不等于这句是假话。","这是被吓着了跟着跑，还没问一句：证据呢？"]},
  {place:"乌龟潭", img:"assets/maze/turtle.png?v=4", name:"乌龟", scene:"乌龟潭边，老乌龟捧着一把浆果",
   line:"我爷爷吃这种浆果活了一百岁！你天天吃，也能长命百岁。",
   choices:["它爷爷一个人的事，证明不了谁吃都灵","乌龟本来就长寿，所以它在撒谎","浆果是红色的，红色食物都养生"],
   said:"谁天天吃，都能长命百岁。", why:"我爷爷吃了，活了一百岁。", flaw:"一个人的故事，只能说发生过，说不了是规律。",
   punch:"一个例子，不能当凭据。",
   sent:"他说谁吃都长寿，理由是他爷爷活了一百岁。但一个例子，不能当凭据。",
   side:["攻击说话的人——乌龟长寿是真的，可它这句话照样站不住。","颜色不是规律——这跟「凭个例」是同一个毛病。"]},
  {place:"公鸡岭", img:"assets/maze/rooster.png?v=4", name:"公鸡", scene:"公鸡岭上，公鸡挺着胸脯",
   line:"看见没？我每天一打鸣，太阳就出来。没我叫，天根本亮不了！",
   choices:["打鸣在前、日出在后，不等于太阳是它叫出来的","公鸡起得早，它说的话肯定有道理","它叫得太小声，太阳听不见"],
   said:"太阳是我叫出来的。", why:"每次我先打鸣，太阳后出来。", flaw:"挨着发生的两件事，不一定有因果关系。",
   punch:"先后，不等于因果。",
   sent:"他说太阳是它叫出来的，理由是打鸣在前。但先后，不等于因果。",
   side:["攻击说话的人——起得早是好事，跟这句话对不对没关系。","顺着它的话往下编，越编越远了。"]},
  {place:"老虎洞", img:"assets/maze/tiger.png?v=4", name:"狐狸", scene:"老虎洞前，狐假虎威",
   line:"瞧见没？它们都怕我，才跑的。",
   said:"动物们是怕我才跑的。", why:"我一走过去，它们就四散奔逃。", flaw:"它们怕的明明是身后的老虎。话被偷换了。",
   punch:"他说的，不是那回事。",
   sent:"他说动物们怕它，理由是动物们奔逃。但它们怕的是老虎，不是狐狸。",
   side:["还是没看「怕」的对象——怕的是老虎，跟跑得快没关系。","怪观众胆小，不检查话本身——这毛病和它犯的一样。"],
   choices:["动物们怕的是老虎，狐狸把意思换成了「怕它」","狐狸跑得比老虎快，所以动物们怕它","小动物们的胆子太小了"]}
];
var SIDES = ["①","②","③"];
var phase = "intro";
var lineTimer = null;
var kid = document.getElementById("kid");
var glow = document.getElementById("glow");
/* bottom%, width% — farther up the path = smaller figure */
var stops = [
  {b:3,w:62},{b:14,w:54},{b:26,w:48},{b:38,w:42},
  {b:50,w:36},{b:60,w:31},{b:70,w:26}
];
var stoneY = [14,26,38,50,60,70];
var ac = null;
/* 预览面板 / 沙箱 iframe 里 sessionStorage 可能直接抛异常，
   一旦抛异常整段脚本会中断，游戏就"卡住"了。这里全部包起来。 */
var store = {
  get: function(k){ try { return window.sessionStorage ? sessionStorage.getItem(k) : null; } catch(e){ return null; } },
  set: function(k,v){ try { if (window.sessionStorage) sessionStorage.setItem(k,v); } catch(e){} },
  del: function(k){ try { if (window.sessionStorage) sessionStorage.removeItem(k); } catch(e){} }
};
var muted = store.get("maze-mute") === "1";
var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var lockAt = 0;
function lockPhase(){ phase = "locked"; lockAt = Date.now(); }
/* 兜底：任何异常让 locked 状态超时，就自动恢复到可操作状态 */
setInterval(function(){
  if (phase !== "locked" || Date.now() - lockAt < 1500) return;
  phase = document.getElementById("nextGo") ? "reveal" : "choose";
}, 400);

function paintPath(n){
  var step = stops[Math.min(n, 6)];
  if (kid){
    kid.style.bottom = step.b + "%";
    kid.style.width = step.w + "%";
  }
  if (glow){
    glow.style.bottom = (step.b + step.w * 0.22) + "%";
    glow.style.width = (step.w * 0.95) + "%";
  }
  var lamps = document.getElementById("lamps");
  lamps.innerHTML = "";
  var stones = document.getElementById("stones");
  stones.innerHTML = "";
  for (var i = 0; i < 6; i++){
    var dot = document.createElement("i");
    if (i < n) dot.className = "on";
    lamps.appendChild(dot);
    var stone = document.createElement("i");
    stone.style.bottom = stoneY[i] + "%";
    if (i < n) stone.className = "on";
    stones.appendChild(stone);
  }
}
function spawnMotes(){
  var box = document.getElementById("motes");
  if (!box || reduceMotion) return;
  box.innerHTML = "";
  for (var i = 0; i < 14; i++){
    var m = document.createElement("i");
    m.style.left = (8 + Math.random() * 84) + "%";
    m.style.bottom = (Math.random() * 70) + "%";
    m.style.animationDuration = (6 + Math.random() * 8) + "s";
    m.style.animationDelay = (-Math.random() * 10) + "s";
    m.style.width = m.style.height = (2 + Math.random() * 2.5) + "px";
    box.appendChild(m);
  }
}
function orderFor(i){
  var r = (i + 1) % 3;
  return [0,1,2].slice(r).concat([0,1,2].slice(0, r));
}
function bus(){
  if (muted) return null;
  if (!ac){
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();
  }
  if (ac.state === "suspended") ac.resume();
  return ac;
}
function tone(freq, dur, type){
  var ctx = bus();
  if (!ctx) return;
  var o = ctx.createOscillator();
  var g = ctx.createGain();
  o.type = type || "sine";
  o.frequency.value = freq;
  var t = ctx.currentTime;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.06, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t + dur);
}
function sfxOk(){ tone(523, 0.09, "sine"); setTimeout(function(){ tone(784, 0.14, "sine"); }, 90); }
function sfxBad(){ tone(196, 0.12, "triangle"); }
function setMute(on){
  muted = on;
  store.set("maze-mute", on ? "1" : "0");
  document.getElementById("mute").textContent = on ? "声音关" : "声音开";
  document.getElementById("mute").setAttribute("aria-pressed", on ? "true" : "false");
}
function skipLine(){
  if (phase !== "line" || !lineTimer) return;
  clearInterval(lineTimer.timer);
  lineTimer.el.textContent = lineTimer.full;
  var done = lineTimer.done;
  lineTimer = null;
  phase = "choose";
  done();
}
function speak(text, done){
  var el = document.getElementById("line");
  var full = "「" + text + "」";
  if (reduceMotion){
    el.textContent = full;
    phase = "choose";
    done();
    return;
  }
  phase = "line";
  var n = 0;
  el.textContent = "";
  var timer = setInterval(function(){
    n += 1;
    el.textContent = full.slice(0, n);
    if (n >= full.length){
      clearInterval(timer);
      lineTimer = null;
      phase = "choose";
      done();
    }
  }, 18);
  lineTimer = { timer: timer, el: el, full: full, done: done };
}
function showGate(title, text, label, fn){
  document.getElementById("gateTitle").textContent = title;
  document.getElementById("gateText").textContent = text;
  var btn = document.getElementById("gateBtn");
  btn.textContent = label;
  btn.onclick = fn;
  document.getElementById("gate").style.display = "grid";
}
function hideGate(){ document.getElementById("gate").style.display = "none"; }

function renderLevel(i){
  var L = LEVELS[i];
  phase = "line";
  document.getElementById("where").textContent = (i+1)+" / 6 · "+L.place;
  document.getElementById("name").textContent = L.name;
  document.getElementById("scene").textContent = L.scene;
  document.getElementById("face").innerHTML = '<img alt="'+L.name+'" src="'+L.img+'">';
  document.getElementById("face").classList.remove("pop");
  document.getElementById("ask").textContent = "听完它说的话，再挑一个说法。空格可以快进。";
  document.getElementById("miss").textContent = "";
  document.getElementById("reveal").className = "reveal";
  document.getElementById("reveal").innerHTML = "";
  document.getElementById("forks").innerHTML = "";
  paintPath(i);
  speak(L.line, function(){ showChoices(i); });
}
function showChoices(i){
  var L = LEVELS[i];
  var order = orderFor(i);
  var box = document.getElementById("forks");
  box.innerHTML = "";
  document.getElementById("ask").textContent = "三个说法，只有一个站得住。";
  order.forEach(function(src, k){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "fork in";
    b.style.animationDelay = (k * 70) + "ms";
    b.dataset.src = String(src);
    b.innerHTML = "<i>"+SIDES[k]+"</i><span>"+L.choices[src]+"</span>";
    b.onclick = function(){ pick(i, src, b); };
    box.appendChild(b);
  });
  phase = "choose";
  var first = box.querySelector(".fork");
  if (first) first.focus();
}
function pick(i, src, btn){
  if (phase !== "choose") return;
  var L = LEVELS[i];
  if (src !== 0){
    lockPhase();
    btn.classList.add("bad");
    if (!reduceMotion){
      document.querySelector(".clearing").classList.add("hit");
      kid.classList.add("back");
    }
    var note = (L.side && L.side[src - 1]) ? L.side[src - 1] : "这个说法站不住。再听它说一遍。";
    document.getElementById("miss").textContent = note;
    sfxBad();
    setTimeout(function(){
      btn.classList.remove("bad");
      document.querySelector(".clearing").classList.remove("hit");
      kid.classList.remove("back");
      phase = "choose";
    }, 420);
    return;
  }
  lockPhase();
  Array.prototype.forEach.call(document.querySelectorAll(".fork"), function(b){ b.disabled = true; });
  btn.classList.add("good");
  document.getElementById("face").classList.add("pop");
  document.getElementById("miss").textContent = "";
  document.getElementById("ask").textContent = "雾散了。一起读：" + L.sent;
  sfxOk();
  paintPath(i+1);
  store.set("maze-at", String(i+1));
  var box = document.getElementById("reveal");
  box.className = "reveal on";
  var next = i === LEVELS.length-1 ? "走出森林" : "继续往前";
  box.innerHTML =
    "<div><b>它说了什么</b><span>"+L.said+"</span></div>"+
    "<div><b>它凭什么</b><span>"+L.why+"</span></div>"+
    "<div><b>毛病在哪</b><span>"+L.flaw+"</span></div>"+
    "<button type='button' class='go' id='nextGo'>"+next+"</button>";
  phase = "reveal";
  var go = document.getElementById("nextGo");
  go.onclick = function(){ advance(i); };
  try { box.scrollIntoView({block:"nearest", behavior:"smooth"}); } catch(e){}
  try { go.focus({preventScroll:true}); } catch(e){ go.focus(); }
}
function advance(i){
  if (phase !== "reveal" && phase !== "outro") return;
  if (i >= LEVELS.length-1){
    phase = "outro";
    paintPath(6);
    document.getElementById("where").textContent = "林外";
    showGate("走出森林了", "六句话都听清了。大家都跑、名头响、吓人、一个例子、先后，都不能当凭据。最后一句，狐狸把怕老虎换成了怕它。记住那个公式：他说什么，理由是什么。但什么，不能当凭据。", "回课上看六张卡片", function(){
      store.del("maze-at");
      var dest = "20-m2-pilot-deck.html#6";
      if (window.top && window.top !== window) window.top.location.href = dest;
      else location.href = dest;
    });
    return;
  }
  renderLevel(i+1);
}
document.addEventListener("keydown", function(e){
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "m" || e.key === "M"){ setMute(!muted); return; }
  if ((phase === "intro" || phase === "outro") && (e.key === " " || e.key === "Enter")){
    e.preventDefault();
    document.getElementById("gateBtn").click();
    return;
  }
  if (phase === "line" && (e.key === " " || e.key === "Enter")){ e.preventDefault(); skipLine(); return; }
  if (phase === "reveal" && (e.key === "Enter" || e.key === " ")){
    e.preventDefault();
    var go = document.getElementById("nextGo");
    if (go) go.click();
    return;
  }
  if (phase !== "choose") return;
  var forks = document.querySelectorAll(".fork:not(:disabled)");
  if (!forks.length) return;
  var idx = Array.prototype.indexOf.call(forks, document.activeElement);
  if (e.key === "ArrowDown"){ e.preventDefault(); forks[idx < 0 ? 0 : Math.min(forks.length - 1, idx + 1)].focus(); }
  if (e.key === "ArrowUp"){ e.preventDefault(); forks[idx < 0 ? 0 : Math.max(0, idx - 1)].focus(); }
  if (e.key === "1" || e.key === "2" || e.key === "3"){
    e.preventDefault();
    var n = +e.key - 1;
    if (forks[n]) forks[n].click();
  }
});
document.getElementById("line").addEventListener("click", function(){ if (phase === "line") skipLine(); });
document.getElementById("mute").addEventListener("click", function(){ setMute(!muted); });
paintPath(0);
spawnMotes();
setMute(muted);
document.getElementById("gateBtn").focus();
var saved = +store.get("maze-at") || 0;
document.getElementById("gateBtn").onclick = function(){
  hideGate();
  renderLevel(saved > 0 && saved < 6 ? saved : 0);
};
if (saved > 0 && saved < 6){
  document.getElementById("gateText").textContent = "上次走到第 " + (saved+1) + " 个路口。可以从那里继续，雾还没散完。";
  document.getElementById("gateBtn").textContent = "从这里继续";
}
</script>
