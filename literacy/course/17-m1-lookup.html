<head>
<meta charset="UTF-8">

<title>需要密码 · AI 课程库</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: grid; place-items: center; background: #0A0A0A;
    color: #FAFAFA; font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
  .card { width: min(420px, calc(100vw - 40px)); padding: 30px 28px 26px; border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px; background: #111; box-shadow: 0 24px 60px rgba(0,0,0,.55); }
  h1 { font-size: 17px; font-weight: 650; letter-spacing: .01em; }
  p.sub { margin-top: 8px; font-size: 13px; line-height: 1.65; color: #8A8A8A; }
  form { margin-top: 20px; display: grid; gap: 10px; }
  input { width: 100%; padding: 11px 12px; font: inherit; font-size: 14px; color: #FAFAFA;
    background: #0A0A0A; border: 1px solid rgba(255,255,255,.16); border-radius: 9px; }
  input:focus { outline: none; border-color: rgba(255,255,255,.4); }
  button { padding: 11px 12px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    color: #0A0A0A; background: #FAFAFA; border: 0; border-radius: 9px; }
  button:disabled { opacity: .5; cursor: default; }
  .err { min-height: 18px; font-size: 12.5px; color: #ff8a8a; }
  .foot { margin-top: 16px; font-size: 11.5px; color: #525252; line-height: 1.6; }
</style>
</head>

    <input id="pw" type="password" autocomplete="current-password" placeholder="访问密码" autofocus>
    <button id="go" type="submit">进入</button>
    <div class="err" id="err"></div>
  </form>
  <p class="foot">内容已加密存放，没有密码无法读取正文。忘了密码请联系课程负责人。</p>

const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function deriveKey(pw, saltB64) {
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(saltB64), iterations: 310000, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]
  );
}

async function open_(key) {
  try {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(IV) }, key, b64(CT));
    document.open(); document.write(dec.decode(plain)); document.close();
    return true;
  } catch (e) { return false; }
}

(async () => {
  const saved = localStorage.getItem(STORE);
  if (saved) {
    try {
      const raw = Uint8Array.from(atob(saved), (c) => c.charCodeAt(0));
      const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", true, ["decrypt"]);
      if (await open_(key)) return;
    } catch (e) {}
    localStorage.removeItem(STORE);
  }
})();

document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  const pw = document.getElementById("pw").value;
  if (!pw) return;
  btn.disabled = true; btn.textContent = "验证中…"; err.textContent = "";
  const key = await deriveKey(pw, SALT);
  if (await open_(key)) {
    try {
      const raw = await crypto.subtle.exportKey("raw", key);
      localStorage.setItem(STORE, btoa(String.fromCharCode(...new Uint8Array(raw))));
    } catch (e) {}
  } else {
    btn.disabled = false; btn.textContent = "进入";
    err.textContent = "密码不对，再试一次。";
    document.getElementById("pw").select();
  }
});
