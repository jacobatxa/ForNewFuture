<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拉链 · 案例页</title>
<style>
  :root{--bg:#0B0B0B;--ink:#E8E8E8;--dim:#8A8A8A;--gold:#E8B86A}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB",sans-serif}
  .wrap{width:min(720px,100% - 32px);margin:0 auto;padding:36px 0 72px}
  .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);letter-spacing:.08em}
  h1{font-size:28px;margin:10px 0 8px}
  .spine{font-size:16px;line-height:1.7;color:#D8D8D8;margin-bottom:24px}
  .spine b{color:var(--gold)}
  svg{width:100%;height:auto;display:block}
  .list{margin-top:18px}
  .list div{padding:10px 0;border-top:1px solid #222;font-size:15px;line-height:1.55}
  .list i{font-style:normal;color:var(--gold);font-weight:800;margin-right:8px}
  .warn{margin-top:22px;font-size:14px;color:var(--dim);line-height:1.6}
  a{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <div class="meta"><span>Fig 1</span><span>拉链 · 拉头把两排齿咬合</span></div>
  <h1>拉链</h1>
  <p class="spine">我把「<b>拉头把两排齿咬合</b>」的共同点叫作「<b>拉链</b>」。只要是靠拉头把两排齿咬合来开合的就算；一旦只是纽扣把两边扣上，就不算。</p>
  <svg viewBox="0 0 720 320" aria-label="拉链拆开">
    <rect width="720" height="320" fill="#0B0B0B"/>
    <path d="M90 70h140v180H90z" fill="#1A1A1A" stroke="#9A9A9A"/>
    <path d="M490 70h140v180H490z" fill="#1A1A1A" stroke="#9A9A9A"/>
    <g fill="#3A3A3A" stroke="#C8C8C8">
      <rect x="220" y="88" width="28" height="16" rx="2"/>
      <rect x="220" y="118" width="28" height="16" rx="2"/>
      <rect x="220" y="148" width="28" height="16" rx="2"/>
      <rect x="220" y="178" width="28" height="16" rx="2"/>
      <rect x="220" y="208" width="28" height="16" rx="2"/>
      <rect x="472" y="88" width="28" height="16" rx="2"/>
      <rect x="472" y="118" width="28" height="16" rx="2"/>
      <rect x="472" y="148" width="28" height="16" rx="2"/>
      <rect x="472" y="178" width="28" height="16" rx="2"/>
      <rect x="472" y="208" width="28" height="16" rx="2"/>
    </g>
    <path d="M300 40h120v70H300z" fill="#2A2A2A" stroke="#E8B86A" stroke-width="1.6"/>
    <path d="M332 110h56v36h-56z" fill="#111" stroke="#E8B86A"/>
    <path d="M348 146h24v40h-24z" fill="#111" stroke="#888"/>
    <text x="360" y="82" text-anchor="middle" fill="#E8B86A" font-size="14" font-family="sans-serif">1 拉头</text>
    <text x="160" y="64" text-anchor="middle" fill="#AAAAAA" font-size="13" font-family="sans-serif">3 布边</text>
    <text x="560" y="64" text-anchor="middle" fill="#AAAAAA" font-size="13" font-family="sans-serif">3 布边</text>
    <text x="234" y="252" text-anchor="middle" fill="#E8E8E8" font-size="13" font-family="sans-serif">2 齿</text>
    <text x="486" y="252" text-anchor="middle" fill="#E8E8E8" font-size="13" font-family="sans-serif">2 齿</text>
  </svg>
  <div class="list">
    <div><i>1</i>拉头：里面有槽，走过时把两边的齿挤到一起。</div>
    <div><i>2</i>齿：一排排错开，被挤紧后互相卡住。</div>
    <div><i>3</i>布边：把齿缝在开口两边，本身不合上开口。</div>
    <div><i>底下</i>拉头挤齿咬合 → 卡住 → 反方向拉开。</div>
  </div>
  <p class="warn">两处可能不对：有的拉链是尼龙螺旋齿，不是一块块金属齿；拉头里的槽到底怎么绕，这页画的是示意，不是剖开的真模具。<br><a href="17-m1-method.html">回到造句卡</a></p>
</div>
</body>
</html>
