<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 奇幻乐园</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A1028;--paper:#FFF6EA;--dim:#5C5168;
    --font:"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;
    --display:"Syne","PingFang SC",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:
    radial-gradient(900px 420px at 8% -10%, #FF8BD2 0, transparent 55%),
    radial-gradient(800px 480px at 100% 0, #7CFFB2 0, transparent 50%),
    radial-gradient(700px 500px at 70% 110%, #8EB6FF 0, transparent 46%),
    var(--paper);
    color:var(--ink);font-family:var(--font);min-height:100%}
  a{color:inherit}
  header{padding:28px 4vw 8px}
  .back{font-size:13px;font-weight:700;letter-spacing:.08em}
  h1{font-family:var(--display);font-size:clamp(46px,8vw,92px);line-height:.9;letter-spacing:-.04em;margin:10px 0 12px}
  h1 span{display:block;font-family:var(--font);font-size:clamp(16px,2vw,20px);font-weight:700;letter-spacing:0;line-height:1.45;max-width:36em;margin-top:12px}
  .bar{position:sticky;top:0;z-index:3;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 4vw;background:rgba(255,246,234,.9);backdrop-filter:blur(8px)}
  button.f,input{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:8px 14px;font:700 14px var(--font);cursor:pointer}
  button.f.on{background:var(--ink);color:#fff}
  input{min-width:180px;cursor:text}
  #count{font-weight:800;font-size:14px}
  main{padding:8px 4vw 64px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  article{border:2px solid var(--ink);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;background:#fff;box-shadow:6px 6px 0 var(--ink)}
  article a.card{display:flex;flex-direction:column;flex:1;color:inherit;text-decoration:none;padding:0 0 14px}
  .shot{position:relative;aspect-ratio:16/10;overflow:hidden;border-bottom:2px solid var(--ink)}
  .shot span{position:absolute;inset:0;display:grid;place-items:center;padding:16px;text-align:center;font-family:var(--display);font-size:clamp(22px,3vw,28px);font-weight:800;color:#fff;letter-spacing:-.03em;line-height:1.15}
  .shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;background:#fff}
  article .pad{padding:12px 14px 0}
  article b{font-size:20px;line-height:1.25;letter-spacing:-.02em}
  article p{margin-top:6px;font-size:14px;line-height:1.45;color:#2A2038}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding:12px 14px 0}
  .tags i{font-style:normal;font-size:11px;font-weight:800;border:1.5px solid var(--ink);border-radius:999px;padding:2px 7px;background:#fff}
  .go{margin:10px 14px 0;font-weight:800;font-size:14px}
  article[data-cat="玩"] .shot{background:#7A4DFF}
  article[data-cat="画"] .shot{background:#E85D4C}
  article[data-cat="视"] .shot{background:#1F6BFF}
  article[data-cat="声"] .shot{background:#0E8A6A}
  article[data-cat="三维"] .shot{background:#C45A12}
  article[data-cat="聊"] .shot{background:#5B3FA8}
  article[data-cat="做"] .shot{background:#C43B73}
  article[data-cat="库"] .shot{background:#243044}
  footer{padding:0 4vw 40px;font-size:13px;color:var(--dim);line-height:1.5}
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">← 回到课程</a>
  <h1>AI 奇幻乐园<span>别人正在用 AI 干什么。能点的就点开。课上先看标着「打开就能试」的。要登录的，回家用。句子还是你自己写。</span></h1>
</header>
<div class="bar">
  <button class="f on" type="button" data-k="全部">全部</button>
  <button class="f" type="button" data-k="打开就能试">打开就能试</button>
  <button class="f" type="button" data-k="玩">小实验</button>
  <button class="f" type="button" data-k="画">画画</button>
  <button class="f" type="button" data-k="视">视频</button>
  <button class="f" type="button" data-k="声">声音</button>
  <button class="f" type="button" data-k="三维">三维</button>
  <button class="f" type="button" data-k="聊">聊天</button>
  <button class="f" type="button" data-k="做">做东西</button>
  <button class="f" type="button" data-k="库">GitHub</button>
  <input id="q" placeholder="搜名字" aria-label="搜索">
  <span id="count"></span>
</div>
<main id="wall"></main>
<footer>「打开就能试」用本地图。其余是色块加名字，不截登录墙。点开是别人的网站。</footer>
<script src="works.js"></script>
<script>
const name = {玩:'小实验',画:'画画',视:'视频',声:'声音',三维:'三维',聊:'聊天',做:'做东西',库:'GitHub'};
const wall = document.getElementById('wall');
const shots = window.SHOTS || {};
let key = '全部';
function esc(s){return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function show(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = window.WORKS.filter(w => {
    const hit = key === '全部' || w[2] === key || w[3] === key;
    const text = (w[0] + w[1] + w[5] + w[6]).toLowerCase().includes(q);
    return hit && text;
  }).sort((a, b) => {
    const pa = a[3] === '打开就能试' ? 0 : 1;
    const pb = b[3] === '打开就能试' ? 0 : 1;
    if (pa !== pb) return pa - pb;
    const sa = shots[a[4]] ? 0 : 1;
    const sb = shots[b[4]] ? 0 : 1;
    return sa - sb;
  });
  wall.innerHTML = list.map(w => {
    const img = shots[w[4]];
    const face = img
      ? `<img alt="" loading="lazy" src="${esc(img)}" onerror="this.remove()">`
      : '';
    const label = img ? '' : esc(w[0]);
    return `
    <article data-cat="${esc(w[2])}">
      <a class="card" href="${esc(w[4])}" target="_blank" rel="noopener">
        <div class="shot"><span>${label}</span>${face}</div>
        <div class="pad"><b>${esc(w[0])}</b><p>${esc(w[1])}。${esc(w[6])}</p></div>
        <div class="tags"><i>${esc(name[w[2]] || w[2])}</i><i>${esc(w[3])}</i><i>${esc(w[5])}</i></div>
        <div class="go">打开 →</div>
      </a>
    </article>`;
  }).join('');
  document.getElementById('count').textContent = list.length + ' 个';
}
document.querySelectorAll('.f').forEach(b => b.onclick = () => {
  document.querySelectorAll('.f').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  key = b.dataset.k;
  show();
});
document.getElementById('q').oninput = show;
show();
</script>
</body>
</html>
