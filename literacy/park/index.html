<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 奇幻乐园</title>
<meta name="description" content="AI 奇幻乐园：给 10–15 岁学生的 AI 工具地图。每条卡片右上角标了它自己的门槛：免登录可试、要登录、需海外网络、看项目。">
<meta property="og:title" content="AI 奇幻乐园">
<meta property="og:description" content="别人正在用 AI 干什么。160 多个入口，标清哪一档能直接点开。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#FFF6EA">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%A1%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --ink:#1A1028;--paper:#FFF6EA;--dim:#5C5168;
    --font:"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;
    --display:"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:
    radial-gradient(900px 420px at 8% -10%, #FF8BD2 0, transparent 55%),
    radial-gradient(800px 480px at 100% 0, #7CFFB2 0, transparent 50%),
    radial-gradient(700px 500px at 70% 110%, #8EB6FF 0, transparent 46%),
    var(--paper);
    color:var(--ink);font-family:var(--font);min-height:100%}
  a{color:inherit}
  header{padding:28px 4vw 8px}
  .back{font-size:13px;font-weight:700;letter-spacing:.08em}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(46px,8vw,92px);line-height:.9;letter-spacing:-.04em;margin:10px 0 12px}
  h1 span{display:block;font-family:var(--font);font-size:clamp(16px,2vw,20px);font-weight:700;letter-spacing:0;line-height:1.45;max-width:36em;margin-top:12px}
  .bar{position:sticky;top:0;z-index:3;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 4vw;background:rgba(255,246,234,.94);backdrop-filter:blur(8px);border-bottom:1.5px solid rgba(26,16,40,.12)}
  button.f,input{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:8px 14px;font:700 14px var(--font);cursor:pointer}
  button.f.on{background:var(--ink);color:#fff}
  input{min-width:180px;cursor:text}
  #count{font-weight:800;font-size:14px}
  .legend{padding:10px 4vw 2px;font-size:12.5px;color:var(--dim);line-height:1.6}
  .legend b{color:var(--ink)}
  main{padding:10px 4vw 64px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  article{border:2px solid var(--ink);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:6px 6px 0 var(--ink)}
  article a.card{display:flex;flex-direction:column;flex:1;color:inherit;text-decoration:none;padding:0 0 14px}
  .shot{position:relative;aspect-ratio:16/10;overflow:hidden;border-bottom:2px solid var(--ink);background:transparent}
  .shot span{position:absolute;inset:0;display:grid;place-items:center;padding:18px;text-align:center;font-family:var(--display);font-size:clamp(24px,3.2vw,32px);font-weight:800;color:var(--ink);letter-spacing:-.03em;line-height:1.15}
  .shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;background:#fff}
  article.has-shot .shot{background:#fff}
  .gate{position:absolute;top:10px;right:10px;z-index:2;font-style:normal;font-size:11.5px;font-weight:800;border:1.5px solid var(--ink);border-radius:999px;padding:3px 9px;background:#fff;box-shadow:2px 2px 0 rgba(26,16,40,.22);white-space:nowrap}
  .gate.g-open{background:#B8F5C8}
  .gate.g-login{background:#FFE28A}
  .gate.g-abroad{background:#D9D2F0}
  .gate.g-project{background:#EFE7DA}
  article .pad{padding:12px 14px 0}
  article b{font-size:20px;line-height:1.25;letter-spacing:-.02em}
  article p{margin-top:6px;font-size:14px;line-height:1.45;color:#2A2038}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding:12px 14px 0}
  .tags i{font-style:normal;font-size:11px;font-weight:800;border:1.5px solid var(--ink);border-radius:999px;padding:2px 7px;background:#fff}
  .tags i.g-open{background:#B8F5C8}
  .tags i.g-login{background:#FFE28A}
  .tags i.g-abroad{background:#D9D2F0}
  .tags i.g-project{background:#EFE7DA}
  .go{margin:10px 14px 0;font-weight:800;font-size:14px}
  .empty{padding:36px 4vw;font-size:15px;color:var(--dim)}
  footer{padding:0 4vw 40px;font-size:13px;color:var(--dim);line-height:1.6}

  .feat{padding:6px 4vw 14px}
  .feat a{display:grid;gap:4px;border:2px solid var(--ink);border-radius:22px;background:#FFE28A;
    box-shadow:6px 6px 0 var(--ink);padding:16px 18px;text-decoration:none;
    transition:transform .16s ease, box-shadow .16s ease}
  .feat a:hover{transform:translate(-2px,-2px);box-shadow:9px 9px 0 var(--ink)}
  .feat b{font-family:var(--display);font-weight:800;font-size:clamp(20px,2.6vw,26px);letter-spacing:-.03em}
  .feat span{font-size:14px;line-height:1.5;color:#2A2038}
  .feat i{font-style:normal;font-weight:800;font-size:13.5px;margin-top:4px}

  @media (max-width:720px){
    header{padding:20px 5vw 6px}
    h1{font-size:clamp(40px,11vw,58px)}
    h1 span{font-size:15px}
    .bar{flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:9px 5vw;scrollbar-width:none}
    .bar::-webkit-scrollbar{display:none}
    .bar button.f,.bar input{padding:7px 12px;font-size:13px;flex:0 0 auto}
    .bar input{min-width:132px}
    #count{flex:0 0 auto;font-size:13px}
    .legend{padding:8px 5vw 0;font-size:12px}
    main{grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:10px;padding:10px 5vw 48px}
    article{border-radius:16px;box-shadow:4px 4px 0 var(--ink)}
    article b{font-size:17px}
    article p{font-size:12.5px}
    .tags{padding:9px 10px 0;gap:5px}
    .tags i{font-size:10px;padding:1px 6px}
    .gate{font-size:10px;padding:2px 7px;top:8px;right:8px}
    .go{margin:8px 10px 0;font-size:13px}
    .feat{padding:4px 5vw 12px}
  }
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">← 回到课程</a>
  <h1>AI 奇幻乐园<span>别人正在用 AI 干什么。能点的就点开。每条卡片右上角都标了这一条自己的门槛：免登录可试、要登录、需海外网络、看项目。课上先挑能试的。句子还是你自己写。</span></h1>
</header>

<div class="feat">
  <a href="agents/">
    <b>自学智能体</b>
    <span>同学们自己写的自学助手 — 复制一段话，粘到豆包或 DeepSeek 就能用</span>
    <i>进去看看 →</i>
  </a>
</div>
<div class="bar" role="toolbar" aria-label="筛选">
  <button class="f on" type="button" data-k="全部" aria-pressed="true">全部</button>
  <button class="f" type="button" data-k="玩">小实验</button>
  <button class="f" type="button" data-k="画">画画</button>
  <button class="f" type="button" data-k="视">视频</button>
  <button class="f" type="button" data-k="声">声音</button>
  <button class="f" type="button" data-k="三维">三维</button>
  <button class="f" type="button" data-k="聊">聊天</button>
  <button class="f" type="button" data-k="做">做东西</button>
  <button class="f" type="button" data-k="库">资源库</button>
  <input id="q" placeholder="搜名字、用途或备注" aria-label="搜索">
  <span id="count"></span>
</div>
<div class="legend">卡片右上角的角标是这一条自己的门槛，不是分类：<b>免登录可试</b>｜<b>要登录</b>｜<b>需海外网络</b>｜<b>看项目</b>。</div>
<main id="wall"></main>
<footer>2026-11-19 逐条点开核验。门槛看卡片右上角；「需海外网络」的别再当成能点的。免登录可试的用本地图，其余是色块加名字，不截登录墙。点开是别人的网站。</footer>
<script src="works.js"></script>
<script>
const name = {玩:'小实验',画:'画画',视:'视频',声:'声音',三维:'三维',聊:'聊天',做:'做东西',库:'资源库'};
const wall = document.getElementById('wall');
const shots = window.SHOTS || {};
const PALETTE = ['#FFE28A','#FFB4D8','#B8F5C8','#C9D6FF','#FFD0B0'];
const gateRank = {'打开就能试':0,'要登录':1,'需海外网络':2,'看项目':3};
const gateClass = {'打开就能试':'g-open','要登录':'g-login','需海外网络':'g-abroad','看项目':'g-project'};
const gateLabel = {'打开就能试':'免登录可试','要登录':'要登录','需海外网络':'需海外网络','看项目':'看项目'};
let key = '全部';
function esc(s){return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function colorFor(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%997;return PALETTE[h%5];}
function show(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = window.WORKS.filter(w => {
    const hit = key === '全部' || w[2] === key || w[3] === key;
    const text = (w[0] + w[1] + w[5] + w[6]).toLowerCase().includes(q);
    return hit && text;
  }).sort((a, b) => {
    const pa = gateRank[a[3]] ?? 9, pb = gateRank[b[3]] ?? 9;
    if (pa !== pb) return pa - pb;
    const sa = shots[a[4]] ? 0 : 1, sb = shots[b[4]] ? 0 : 1;
    return sa - sb;
  });
  if(!list.length){ wall.innerHTML = '<div class="empty">没有匹配的，换个词试试。</div>'; }
  else wall.innerHTML = list.map(w => {
    const img = shots[w[4]];
    const face = img
      ? `<img alt="" loading="lazy" src="${esc(img)}" onerror="this.remove()">`
      : '';
    const label = img ? '' : esc(w[0]);
    const note = w[6] ? '。' + esc(w[6]) : '';
    return `
    <article class="${img ? 'has-shot' : ''}" data-cat="${esc(w[2])}" style="background:${colorFor(w[0])}">
      <a class="card" href="${esc(w[4])}" target="_blank" rel="noopener">
        <div class="shot"><span>${label}</span>${face}<em class="gate ${gateClass[w[3]] || ''}">${esc(gateLabel[w[3]] || w[3])}</em></div>
        <div class="pad"><b>${esc(w[0])}</b><p>${esc(w[1])}${note}</p></div>
        <div class="tags"><i>${esc(name[w[2]] || w[2])}</i><i>${esc(w[5])}</i></div>
        <div class="go">打开 →</div>
      </a>
    </article>`;
  }).join('');
  const openCount = list.filter(w => w[3] === '打开就能试').length;
  document.getElementById('count').textContent = `${list.length} 个${key === '全部' && q === '' ? '，其中 ' + openCount + ' 个免登录可试' : ''}`;
}
document.querySelectorAll('.f').forEach(b => b.onclick = () => {
  document.querySelectorAll('.f').forEach(x => { x.classList.remove('on'); x.setAttribute('aria-pressed','false'); });
  b.classList.add('on'); b.setAttribute('aria-pressed','true');
  key = b.dataset.k;
  show();
});
document.getElementById('q').oninput = show;
show();
</script>
</body>
</html>
